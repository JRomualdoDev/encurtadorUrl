
services:
  app:
    image: 'postgres:latest'
    build:
      context: .
    container_name: postgres_encurtador_url
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=encurtador_url
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: